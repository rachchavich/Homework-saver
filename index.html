<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Homework Saver — คลังบันทึกคำตอบและจัดเก็บการบ้าน</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 6px 20px -4px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 35px -8px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #fff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-title span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-new-hw {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-new-hw:hover {
      background: var(--primary-hover);
    }

    /* Main Workspace: 2-Column Split Layout */
    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar: Saved List */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .hw-items-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hw-item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
    }

    .hw-item-card:hover {
      background: var(--surface-subtle);
      border-color: #cbd5e1;
    }

    .hw-item-card.active {
      background: #eef2ff;
      border-color: #c7d2fe;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.08);
    }

    .hw-item-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hw-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .status-badge {
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .status-badge.draft { background: #f1f5f9; color: #475569; }
    .status-badge.working { background: #fef3c7; color: #b45309; }
    .status-badge.done { background: #dcfce7; color: #15803d; }

    /* Right Panel: Active Editor Workspace */
    .editor-pane {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-toolbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .auto-save-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--success);
    }

    .auto-save-indicator span.dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
    }

    .toolbar-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .btn-tool:hover {
      background: var(--surface-subtle);
    }

    .btn-tool.danger:hover {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fca5a5;
    }

    /* Editor Body */
    .editor-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title-input {
      font-size: 1.6rem;
      font-weight: 800;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .meta-select, .meta-input {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      outline: none;
      background: var(--surface);
      color: var(--text-main);
    }

    .link-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
    }

    .link-input-group input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.82rem;
      width: 100%;
    }

    /* Worksheet Image Preview */
    .image-preview-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px;
      position: relative;
      max-width: 320px;
      background: var(--surface-subtle);
    }

    .image-preview-box img {
      width: 100%;
      height: auto;
      border-radius: var(--radius-sm);
      display: block;
    }

    .btn-remove-img {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* Big Writing Area */
    .content-textarea {
      flex: 1;
      min-height: 280px;
      border: none;
      outline: none;
      font-size: 1rem;
      line-height: 1.65;
      color: #1e293b;
      resize: none;
      background: transparent;
    }

    .content-textarea::placeholder {
      color: #94a3b8;
    }

    /* Editor Bottom Status Bar */
    .editor-status-bar {
      padding: 10px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface);
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { display: none; } /* On smaller mobile screens */
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">📁</div>
      <div class="brand-title">
        <h1>Homework Saver</h1>
        <span>คลังบันทึกคำตอบและจัดเก็บการบ้าน</span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn-new-hw" onclick="createNewHomework()">+ บันทึกงานใหม่</button>
    </div>
  </header>

  <!-- Main Split-Screen Workspace -->
  <main class="workspace">
    
    <!-- Left Sidebar: List of Saved Homework -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="search-hw" class="search-input" placeholder="🔍 ค้นหาการบ้านที่บันทึกไว้..." />
      </div>
      <div class="hw-items-container" id="hw-list">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Right Panel: The Workspace / Answer Saver -->
    <section class="editor-pane" id="editor-pane">
      
      <!-- Toolbar -->
      <div class="editor-toolbar">
        <div class="auto-save-indicator">
          <span class="dot"></span>
          <span id="save-status-text">บันทึกอัตโนมัติเรียบร้อย</span>
        </div>
        <div class="toolbar-buttons">
          <button class="btn-tool" onclick="document.getElementById('attach-file-input').click()">
            📷 แนบรูปใบงาน
          </button>
          <input type="file" id="attach-file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)" />
          
          <button class="btn-tool" onclick="copyEntireHomework()">📋 คัดลอกคำตอบ</button>
          <button class="btn-tool" onclick="downloadTxtFile()">📥 โหลดไฟล์ .txt</button>
          <button class="btn-tool danger" onclick="deleteCurrentHomework()">🗑️ ลบงานนี้</button>
        </div>
      </div>

      <!-- Editor Canvas -->
      <div class="editor-scroll">
        <!-- Title -->
        <input type="text" id="ed-title" class="title-input" placeholder="พิมพ์หัวข้อการบ้านที่นี่..." oninput="autoSave()" />

        <!-- Meta Controls (Subject, Status, Date) -->
        <div class="meta-row">
          <select id="ed-subject" class="meta-select" onchange="autoSave()">
            <option value="คณิตศาสตร์">📐 คณิตศาสตร์</option>
            <option value="วิทยาศาสตร์ / ฟิสิกส์">🔬 วิทยาศาสตร์ / ฟิสิกส์</option>
            <option value="ภาษาอังกฤษ">🇬🇧 ภาษาอังกฤษ</option>
            <option value="ภาษาไทย">🇹🇭 ภาษาไทย</option>
            <option value="สังคม / ประวัติศาสตร์">🌍 สังคม / ประวัติศาสตร์</option>
            <option value="คอมพิวเตอร์ / IT">💻 คอมพิวเตอร์ / IT</option>
            <option value="อื่นๆ">📌 วิชาอื่นๆ</option>
          </select>

          <select id="ed-status" class="meta-select" onchange="autoSave()">
            <option value="draft">📝 ฉบับร่าง (Draft)</option>
            <option value="working">⏳ กำลังทำ (In Progress)</option>
            <option value="done">✅ เสร็จสมบูรณ์ (Ready to Submit)</option>
          </select>

          <input type="date" id="ed-due" class="meta-input" onchange="autoSave()" />
        </div>

        <!-- Attached Link -->
        <div class="link-input-group">
          <span>🔗</span>
          <input type="url" id="ed-link" placeholder="แนบลิงก์ส่งงาน (เช่น Google Classroom, Google Docs, Canva...)" oninput="autoSave()" />
          <button class="btn-tool" style="padding: 2px 8px; font-size: 0.72rem;" onclick="openAttachedLink()">เปิดลิงก์ ↗</button>
        </div>

        <!-- Image Attachment Preview -->
        <div class="image-preview-box" id="img-box" style="display: none;">
          <button class="btn-remove-img" onclick="removeImage()">✕</button>
          <img id="ed-preview-img" src="" alt="Worksheet Preview" />
        </div>

        <!-- Big Writing Workspace -->
        <textarea id="ed-content" class="content-textarea" placeholder="พิมพ์เนื้อหา คำตอบ หรือบันทึกการบ้านของคุณที่นี่..." oninput="autoSave()"></textarea>
      </div>

      <!-- Status Bar -->
      <div class="editor-status-bar">
        <span id="char-count-text">0 คำ | 0 ตัวอักษร</span>
        <span id="last-edited-text">แก้ไขล่าสุด: เพิ่งสร้าง</span>
      </div>

    </section>

  </main>

  <!-- Toast Element -->
  <div class="toast-box" id="toast">บันทึกแล้ว</div>

  <script>
    // State Store (เซฟลงใน LocalStorage อัตโนมัติ)
    let savedVault = JSON.parse(localStorage.getItem('hw_saver_vault')) || [
      {
        id: '1',
        title: 'สรุปบทความภาษาอังกฤษ Unit 3: Technology in Modern Life',
        subject: 'ภาษาอังกฤษ',
        status: 'done',
        dueDate: new Date().toISOString().split('T')[0],
        link: 'https://classroom.google.com',
        image: '',
        content: 'Technology has revolutionized the way students learn in the 21st century.\n\nKey Takeaways:\n1. Digital collaboration tools enable global teamwork.\n2. AI and personal computing adapt to individual student paces.\n3. Digital well-being remains an essential consideration.',
        updatedAt: new Date().toLocaleString('th-TH')
      },
      {
        id: '2',
        title: 'แก้สมการกำลังสอง ข้อ 1 - 5 หน้า 89',
        subject: 'คณิตศาสตร์',
        status: 'working',
        dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
        link: '',
        image: '',
        content: 'ข้อ 1: 2x² + 5x - 3 = 0\n(2x - 1)(x + 3) = 0\nx = 1/2 หรือ x = -3\n\nข้อ 2: ... (กำลังทำต่อ)',
        updatedAt: new Date().toLocaleString('th-TH')
      }
    ];

    let currentId = savedVault[0] ? savedVault[0].id : null;
    let saveTimeout = null;

    // Elements
    const hwListEl = document.getElementById('hw-list');
    const searchInput = document.getElementById('search-hw');
    const titleInput = document.getElementById('ed-title');
    const subjectInput = document.getElementById('ed-subject');
    const statusInput = document.getElementById('ed-status');
    const dueInput = document.getElementById('ed-due');
    const linkInput = document.getElementById('ed-link');
    const contentInput = document.getElementById('ed-content');
    const imgBox = document.getElementById('img-box');
    const previewImg = document.getElementById('ed-preview-img');
    const charCountText = document.getElementById('char-count-text');
    const lastEditedText = document.getElementById('last-edited-text');
    const saveStatusText = document.getElementById('save-status-text');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    // เรนเดอร์รายชื่อการบ้านฝั่งซ้าย
    function renderSidebar() {
      hwListEl.innerHTML = '';
      const q = searchInput.value.toLowerCase();

      const filtered = savedVault.filter(h => 
        h.title.toLowerCase().includes(q) || 
        h.subject.toLowerCase().includes(q) || 
        h.content.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        hwListEl.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px; font-size:0.85rem;">ไม่พบการบ้านที่บันทึกไว้</div>';
        return;
      }

      filtered.forEach(h => {
        const card = document.createElement('div');
        card.className = `hw-item-card ${h.id === currentId ? 'active' : ''}`;
        card.onclick = () => selectHomework(h.id);

        let statusText = 'ร่าง';
        if (h.status === 'working') statusText = 'กำลังทำ';
        if (h.status === 'done') statusText = 'เสร็จแล้ว';

        card.innerHTML = `
          <div class="hw-item-title">${escapeHtml(h.title || 'ไม่มีชื่อหัวข้อ')}</div>
          <div class="hw-item-meta">
            <span>${h.subject}</span>
            <span class="status-badge ${h.status}">${statusText}</span>
          </div>
        `;
        hwListEl.appendChild(card);
      });
    }

    // เลือกการบ้านขึ้นมาแสดงบน Editor
    function selectHomework(id) {
      currentId = id;
      const hw = savedVault.find(h => h.id === id);
      if (!hw) return;

      titleInput.value = hw.title;
      subjectInput.value = hw.subject;
      statusInput.value = hw.status;
      dueInput.value = hw.dueDate || '';
      linkInput.value = hw.link || '';
      contentInput.value = hw.content || '';

      if (hw.image) {
        previewImg.src = hw.image;
        imgBox.style.display = 'block';
      } else {
        imgBox.style.display = 'none';
        previewImg.src = '';
      }

      updateCounts();
      lastEditedText.textContent = `แก้ไขล่าสุด: ${hw.updatedAt}`;
      renderSidebar();
    }

    // ระบบบันทึกอัตโนมัติ (Auto-Save) เมื่อพิมพ์
    function autoSave() {
      saveStatusText.textContent = 'กำลังบันทึก...';
      clearTimeout(saveTimeout);

      saveTimeout = setTimeout(() => {
        const hw = savedVault.find(h => h.id === currentId);
        if (!hw) return;

        hw.title = titleInput.value.trim() || 'การบ้านไม่มีชื่อ';
        hw.subject = subjectInput.value;
        hw.status = statusInput.value;
        hw.dueDate = dueInput.value;
        hw.link = linkInput.value.trim();
        hw.content = contentInput.value;
        hw.updatedAt = new Date().toLocaleString('th-TH');

        localStorage.setItem('hw_saver_vault', JSON.stringify(savedVault));
        saveStatusText.textContent = 'บันทึกอัตโนมัติเรียบร้อย ✓';
        lastEditedText.textContent = `แก้ไขล่าสุด: ${hw.updatedAt}`;
        renderSidebar();
        updateCounts();
      }, 400);
    }

    // นับจำนวนคำและตัวอักษร
    function updateCounts() {
      const text = contentInput.value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      charCountText.textContent = `${words} คำ | ${chars} ตัวอักษร`;
    }

    // สร้างงานใหม่
    function createNewHomework() {
      const newHw = {
        id: Date.now().toString(),
        title: 'การบ้านใหม่',
        subject: 'คณิตศาสตร์',
        status: 'working',
        dueDate: new Date().toISOString().split('T')[0],
        link: '',
        image: '',
        content: '',
        updatedAt: new Date().toLocaleString('th-TH')
      };

      savedVault.unshift(newHw);
      localStorage.setItem('hw_saver_vault', JSON.stringify(savedVault));
      selectHomework(newHw.id);
      titleInput.focus();
      titleInput.select();
      showToast('สร้างการบ้านใหม่แล้ว ✨');
    }

    // อัปโหลดรูปภาพใบงาน
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64 = evt.target.result;
        const hw = savedVault.find(h => h.id === currentId);
        if (hw) {
          hw.image = base64;
          previewImg.src = base64;
          imgBox.style.display = 'block';
          autoSave();
          showToast('แนบรูปใบงานสำเร็จ 📷');
        }
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      const hw = savedVault.find(h => h.id === currentId);
      if (hw) {
        hw.image = '';
        previewImg.src = '';
        imgBox.style.display = 'none';
        autoSave();
        showToast('ลบรูปภาพแล้ว');
      }
    }

    function openAttachedLink() {
      const url = linkInput.value.trim();
      if (!url) {
        showToast('ยังไม่ได้ระบุลิงก์');
        return;
      }
      window.open(url.startsWith('http') ? url : `https://${url}`, '_blank');
    }

    // คัดลอกคำตอบทั้งหมดไปส่ง
    function copyEntireHomework() {
      const title = titleInput.value;
      const subject = subjectInput.value;
      const content = contentInput.value;

      const fullText = `[${subject}] ${title}\n\n${content}`;
      navigator.clipboard.writeText(fullText).then(() => {
        showToast('คัดลอกคำตอบลงคลิปบอร์ดแล้ว 📋');
      });
    }

    // โหลดเป็นไฟล์ Text (.txt)
    function downloadTxtFile() {
      const title = titleInput.value.trim() || 'homework';
      const subject = subjectInput.value;
      const content = contentInput.value;
      const fullText = `วิชา: ${subject}\nหัวข้อ: ${title}\nวันที่บันทึก: ${new Date().toLocaleString('th-TH')}\n\n-------------------------\nเนื้อหา / คำตอบ:\n-------------------------\n${content}`;

      const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.txt`;
      a.click();
      showToast('ดาวน์โหลดไฟล์ .txt สำเร็จ 📥');
    }

    // ลบการบ้านปัจจุบัน
    function deleteCurrentHomework() {
      if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบการบ้านรายการนี้?')) {
        savedVault = savedVault.filter(h => h.id !== currentId);
        localStorage.setItem('hw_saver_vault', JSON.stringify(savedVault));

        if (savedVault.length > 0) {
          selectHomework(savedVault[0].id);
        } else {
          createNewHomework();
        }
        showToast('ลบการบ้านเรียบร้อย');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    // ค้นหาการบ้าน
    searchInput.addEventListener('input', renderSidebar);

    // เริ่มต้นระบบ
    if (savedVault.length > 0) {
      selectHomework(savedVault[0].id);
    } else {
      createNewHomework();
    }
  </script>
</body>
</html>
